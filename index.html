<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MenuPlus Mula</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;padding:15px} .card{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}</style>
</head><body><h1>Menús hoy en Mula</h1><div id="lista">Cargando...</div>
<script>
const firebaseConfig = { projectId: "menuplus-mula" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.collection("anuncios").orderBy("creado","desc").onSnapshot(snap=>{
  const lista=document.getElementById("lista"); lista.innerHTML="";
  if(snap.empty){ lista.innerHTML="No hay menús ahora"; return; }
  snap.forEach(d=>{
    const data=d.data();
    // El TTL ya borra los caducados, pero por seguridad no mostramos si expireAt ya pasó
    if(data.expireAt && data.expireAt.toDate() < new Date()) return;
    const div=document.createElement("div"); div.className="card";
    div.innerHTML=`<b>${data.comercioId}</b><br>${data.texto}<br><small>Caduca: ${data.expireAt?data.expireAt.toDate().toLocaleString():""}</small>`;
    lista.appendChild(div);
  });
});
</script></body></html>
