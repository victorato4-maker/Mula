<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus Mula</title>
<style>
body{margin:0;font-family:Arial;background:#F5F7FA;color:#002F6C;padding:0;}
header{background:#002F6C;padding:20px;text-align:center;color:#fff}
header img{width:100px;background:#FFC300;padding:10px;border-radius:10px}
header h1{color:#FFC300;margin:10px 0 5px;font-size:28px}
.container{padding:20px;max-width:650px;margin:auto}
.card{border-radius:16px;padding:18px;margin-bottom:8px;box-shadow:0 3px 10px rgba(0,0,0,.1);position:relative}
.amarilla{background:#FFC300}.blanca{background:#fff;border:1px solid #eee}
.recomendado{position:absolute;top:-10px;right:15px;background:#002F6C;color:#fff;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:bold}
.plantilla-captura h3{text-align:center;font-size:24px}
.plantilla-captura p{text-align:center;white-space:pre-line}
.debug{background:red;color:#fff;padding:10px;text-align:center;font-weight:bold}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header><img src="logo-menuplus.png"><h1>MenuPlus Mula</h1></header>
<div class="container">
<div id="debug" class="debug">Cargando...</div>
<div id="listaAnuncios"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfKMgXwZqzH_v8D4ua5UHLeKIL-Z3iKog",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig); 
const db=firebase.firestore();

function getTurno(){
  const h=new Date().getHours()+new Date().getMinutes()/60; 
  if(h>=8&&h<16)return"comida"; 
  if(h>=16&&h<23.5)return"cena"; 
  return"cerrado";
}

const debug = document.getElementById('debug');
const t = getTurno();
debug.innerText = "Turno actual: " + t + ". Leyendo Firebase...";

db.collection("anuncios").onSnapshot(snapshot=>{
  debug.innerText = "Total ofertas en BD: " + snapshot.size;
  
  const anuncios=[];
  snapshot.forEach(doc=>anuncios.push(doc.data()));
  
  const filtrados = anuncios.filter(a => a.turno && a.turno.toLowerCase() === t);
  
  debug.innerText += " | Ofertas para "+t+": " + filtrados.length;
  
  if(filtrados.length===0){
    document.getElementById('listaAnuncios').innerHTML="<p>No hay ofertas para "+t+"</p>";
    return;
  }
  
  document.getElementById('listaAnuncios').innerHTML = filtrados.map((a,i)=>{
    return `<div class="card ${i===0?'amarilla':'blanca'}">
      ${i===0?'<div class="recomendado">RECOMENDADO</div>':''}
      <h3>${a.bar.toUpperCase()}</h3>
      <p>${a.texto}</p>
    </div>`
  }).join('');
});
</script>
</body>
</html>
