<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus Mula</title>
<style>
body{margin:0;font-family:Arial;background:#fff;color:#002F6C}
header{background:#002F6C;padding:15px 20px;color:#fff;display:flex;align-items:center;gap:10px}
header h1{color:#FFC300;margin:0;font-size:22px}
header h1 span{color:#fff}
.container{padding:20px;max-width:650px;margin:auto}
.container h2{font-size:28px;margin:10px 0 5px}
.container p.sub{color:#555;margin:0 0 20px;font-size:14px}

.card{border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.amarilla{background:#FFC300}
.blanca{background:#fff;border:1px solid #eee}

.cinta{position:absolute;top:0;right:20px;background:#002F6C;color:#fff;padding:6px 12px;border-radius:0 0 8px 8px;font-size:11px;font-weight:bold}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-header h3{margin:0;font-size:24px;color:#002F6C}
.icono{font-size:32px}

.precio-box{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.precio-box.label{font-size:14px;font-weight:bold}
.precio{font-size:48px;font-weight:bold;color:#002F6C;line-height:1}
.precio small{font-size:24px}

.desc{font-size:13px;color:#333;margin-bottom:12px}
.horario{font-size:13px;font-weight:bold;display:flex;align-items:center;gap:6px}
.horario.dot{width:8px;height:8px;border-radius:50%;background:#22C55E}
.horario.cerrado.dot{background:#EF4444}

.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#002F6C;display:flex;justify-content:space-around;padding:10px 0;color:#fff}
.footer-nav div{text-align:center;font-size:12px}
.footer-nav.active{background:#FFC300;color:#002F6C;padding:5px 15px;border-radius:8px;font-weight:bold}
body{padding-bottom:70px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
<h1>Menuplus <span>Mula</span></h1>
</header>

<div class="container">
<h2>Bares en Mula</h2>
<p class="sub" id="fecha">Descubre las mejores ofertas de hoy</p>
<div id="listaAnuncios"></div>
</div>

<div class="footer-nav">
<div class="active">🏠<br>Inicio</div>
<div>🔍<br>Buscar</div>
<div>📤<br>Compartir</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfKMgXwZqzH_v8D4ua5UHLeKIL-Z3iKog",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig); 
const db=firebase.firestore();

function getTurno(){
  const h=new Date().getHours()+new Date().getMinutes()/60; 
  if(h>=8&&h<16)return"comida"; 
  if(h>=16&&h<23.5)return"cena"; 
  return"cerrado";
}

// Sacar precio del texto. Ej: "15€" o "25€"
function extraerPrecio(texto){
  const match = texto.match(/(\d+[,.]?\d*)\s*€/);
  return match? match[1] : '';
}
// Sacar icono según palabra
function getIcono(texto){
  texto = texto.toLowerCase();
  if(texto.includes('sushi')) return '🍣';
  if(texto.includes('menu') || texto.includes('plato')) return '🍴';
  if(texto.includes('tapa') || texto.includes('caña') || texto.includes('cerveza')) return '🍺';
  if(texto.includes('vino')) return '🍷';
  return '🍽️';
}

function pintar(anuncios){
  const lista=document.getElementById('listaAnuncios');
  const t=getTurno();
  
  const filtrados = anuncios.filter(a => a.turno && a.turno.toLowerCase() === t);
  
  if(filtrados.length===0){
    lista.innerHTML="<p style='text-align:center'>No hay ofertas para "+t+" ahora</p>";
    return;
  }
  
  lista.innerHTML = filtrados.map((a,i)=>{
    const precio = extraerPrecio(a.texto);
    const textoSinPrecio = a.texto.replace(/\d+[,.]?\d*\s*€/,'').trim();
    const icono = getIcono(a.texto);
    return `
    <div class="card ${i===0?'amarilla':'blanca'}">
      ${i===0?'<div class="cinta">Recomendado<br>Menuplus</div>':''}
      <div class="card-header">
        <h3>${a.bar.toUpperCase()}</h3>
        <div class="icono">${icono}</div>
      </div>
      
      <div class="precio-box">
        <span class="label">Oferta de hoy:</span>
      </div>
      <div class="precio-box">
        <span class="label">${textoSinPrecio}</span>
      </div>
      <div class="precio">${precio}<small>€</small></div>
      
      <div class="desc">Primer plato + Segundo + Bebida + Postre</div>
      
      <div class="horario"><span class="dot"></span> Abierto ahora • 13:00 - 00:00</div>
    </div>
  `}).join('');
}

db.collection("anuncios").onSnapshot(snapshot=>{
  const anuncios=[];
  snapshot.forEach(doc=>anuncios.push(doc.data()));
  pintar(anuncios);
});

document.getElementById('fecha').innerText="Descubre las mejores ofertas de hoy • Actualizado hoy, "+new Date().toLocaleDateString('es-ES',{day:'numeric', month:'short', year:'numeric'});
</script>
</body>
</html>
