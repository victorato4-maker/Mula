<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus Mula</title>
<style>
body{margin:0;font-family:Arial;background:#F5F7FA;color:#002F6C;padding-bottom:80px;}
header{background:#002F6C;padding:20px;text-align:center;color:#fff}
header img{width:100px;background:#FFC300;padding:10px;border-radius:10px}
header h1{color:#FFC300;margin:10px 0 5px}
.container{padding:20px;max-width:650px;margin:auto}
.card{border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.amarilla{background:#FFC300;position:relative}
.blanca{background:#fff;border:1px solid #eee}
.recomendado{position:absolute;top:-10px;right:15px;background:#002F6C;color:#fff;padding:5px 10px;border-radius:5px;font-size:12px}
.precio{font-size:40px;font-weight:bold;color:#002F6C;margin:10px 0}
.botones{margin-top:10px}
.botones a{margin-right:15px;text-decoration:none;color:#002F6C;font-weight:bold}
.btn{background:#FFC300;color:#002F6C;padding:14px;border:none;border-radius:10px;width:100%;font-weight:bold;font-size:16px;cursor:pointer}
footer{background:#002F6C;padding:12px;display:flex;justify-content:space-around;position:fixed;bottom:0;width:100%;left:0}
footer div{color:#fff;text-align:center;font-size:12px}
#cerradoCartel{background:#FFC700;color:#0A2540;font-size:28px;font-weight:bold;padding:30px;text-align:center;border-radius:12px;margin:40px auto;max-width:600px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
<img src="logo-menuplus.png">
<h1>MenuPlus Mula</h1><p>Descubre las mejores ofertas de hoy</p>
</header>
<div class="container">
<h2>Bares en Mula</h2><p id="fecha">Actualizado hoy</p>

<div id="listaAnuncios"></div>
<div id="cerradoCartel" style="display:none">CERRADO: VUELVE A PARTIR DE LAS 8:00</div>

<div style="border:2px solid #FFC300;padding:20px;border-radius:16px;margin-top:30px;text-align:center">
<h3>¿Eres dueño de un bar en Mula?</h3>
<button class="btn" onclick="window.location.href='admin.html'">Publica tu oferta aquí</button>
</div>
</div>

<footer>
<div>🏠<br>Inicio</div>
<div>🔍<br>Buscar</div>
<div>📤<br>Compartir</div>
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

function getTurno(){const h=new Date().getHours()+new Date().getMinutes()/60; if(h>=8&&h<16)return"comida"; if(h>=16&&h<23.5)return"cena"; return"cerrado";}

function pintar(anuncios){
  const lista=document.getElementById('listaAnuncios');
  const cartel=document.getElementById('cerradoCartel');
  const t=getTurno();
  
  if(t==="cerrado"){
    lista.innerHTML="";
    cartel.style.display="block";
    return;
  }
  cartel.style.display="none";
  
  const filtrados = anuncios.filter(a => a.turno === t);
  
  if(filtrados.length===0){
    lista.innerHTML="<p style='text-align:center'>No hay ofertas activas ahora mismo para "+t+"</p>";
    return;
  }
  
  lista.innerHTML = filtrados.map((a,i)=>`
    <div class="card ${i===0?'amarilla':'blanca'}">
      ${i===0?'<div class="recomendado">Recomendado Menuplus</div>':''}
      <h3>${a.bar.split('@')[0].toUpperCase()}</h3>
      <div>${a.texto}</div>
      <div class="botones">
        <a href="https://wa.me/34684228068">📲 Pedir por WhatsApp</a>
      </div>
    </div>
  `).join('');
}

db.collection("anuncios").onSnapshot(snapshot=>{
  const anuncios=[];
  snapshot.forEach(doc=>anuncios.push(doc.data()));
  pintar(anuncios);
});

document.getElementById('fecha').innerText="Actualizado hoy, "+new Date().toLocaleDateString('es-ES');
setInterval(()=>location.reload(),60000);
</script>
</body>
</html>
