<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus Mula - Bares en Mula</title>
<style>
body{font-family:Arial;background:#F8F9FA;margin:0;padding:0 0 80px 0;color:#002F6C}
header{background:#002F6C;color:#FFC300;padding:18px 20px;position:sticky;top:0;z-index:10}
header.logo{font-size:28px;font-weight:900}
header.logo span{color:#fff}
.container{max-width:700px;margin:auto;padding:20px}
.titulo{font-size:32px;font-weight:900;color:#002F6C;text-align:center;margin-bottom:5px}
.subtitulo{text-align:center;color:#666;margin-bottom:25px;font-size:14px}

.tarjeta{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative}
.tarjeta.amarilla{background:#FFC300}
.tarjeta.badge{position:absolute;top:0;right:15px;background:#002F6C;color:#FFC300;padding:8px 12px;font-size:12px;font-weight:800;border-radius:0 0 8px 8px;text-align:center;line-height:1.3}

.nombre-bar{font-size:26px;font-weight:900;color:#002F6C;margin-bottom:15px;text-transform:uppercase}
.contenido{display:flex;gap:15px;align-items:center}
.icono{font-size:45px;flex-shrink:0}
.datos{flex:1}
.tipo{font-size:16px;color:#002F6C;margin-bottom:2px}
.precio{font-size:70px;font-weight:900;color:#002F6C;line-height:1}
.precio.euro{font-size:45px}
.descripcion{font-size:13px;color:#555;margin-top:6px}

.nav-bottom{display:flex;justify-content:space-around;background:#002F6C;padding:12px 0;position:fixed;bottom:0;width:100%;max-width:700px;left:50%;transform:translateX(-50%)}
.nav-bottom a{color:#FFC300;text-decoration:none;font-size:12px;text-align:center;font-weight:700}
.nav-bottom a.active{background:#FFC300;color:#002F6C;padding:6px 14px;border-radius:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="logo">Menu<span>plus</span> <span style="font-size:20px">Mula</span></div>
</header>

<div class="container">
  <div class="titulo">Bares en Mula</div>
  <div class="subtitulo" id="fecha">Descubre las mejores ofertas de hoy</div>
  <div id="ofertas">Cargando...</div>
</div>

<div class="nav-bottom">
  <a href="#" class="active">🏠<br>Inicio</a>
  <a href="#">🔍<br>Buscar</a>
  <a href="#">📤<br>Compartir</a>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

document.getElementById('fecha').innerText += ' • Actualizado hoy, ' + new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});

function getTurno(){
  const h=new Date().getHours()+new Date().getMinutes()/60;
  if(h>=8&&h<16)return"comida";
  if(h>=16&&h<23.5)return"cena";
  return"comida";
}

function esRecomendado(bar){
  const recomendados = ["BAR CASINO", "LA PEQUEÑA"]; // AÑADE AQUÍ TUS RECOMENDADOS
  return recomendados.includes(bar.toUpperCase());
}

async function cargarOfertas(){
  const turno = getTurno();
  const contenedor = document.getElementById('ofertas');
  const snapshot = await db.collection("anuncios").where("turno","==",turno).orderBy("timestamp","desc").get();
  contenedor.innerHTML = "";

  if(snapshot.empty){
    contenedor.innerHTML = "<p style='text-align:center'>No hay ofertas para este turno todavía</p>";
    return;
  }

  snapshot.forEach(doc => {
    const d = doc.data();
    const esAmarilla = esRecomendado(d.bar);

    let icono = d.tipo === 'oferta'? '🍺' : '🍴';
    let tipoTexto = d.tipo === 'menu'? 'Menú del Día' : 'Oferta de hoy:';
    let descripcion = d.tipo === 'menu'? 'Primer plato + Segundo + Bebida + Postre o Café' : d.textoOferta || '';

    const tarjeta = `
    <div class="tarjeta ${esAmarilla? 'amarilla' : ''}">
      ${esAmarilla? '<div class="badge">Recomendado<br>Menuplus</div>' : ''}
      <div class="nombre-bar">${d.bar}</div>

      <div class="contenido">
        <div class="icono">${icono}</div>
        <div class="datos">
          <div class="tipo">${tipoTexto}</div>
          <div class="precio">${d.precio}<span class="euro">€</span></div>
          ${descripcion? `<div class="descripcion">${descripcion}</div>` : ''}
        </div>
      </div>
    </div>`;
    contenedor.innerHTML += tarjeta;
  });
}

cargarOfertas();
</script>
</body>
</html>
