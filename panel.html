<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel - MenuPlus Mula</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap'); body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#fafafa] min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-[420px] rounded-[24px] shadow-[0_20px_60px_rgba(0,0,0,0.08)] p-8">
<h1 class="text-[26px] font-bold mb-1">Publicar menú</h1>
<p class="text-sm text-gray-500 mb-6">Se borrará solo a las 16:00 o 23:30</p>

<label class="text-[12px] font-bold tracking-widest text-gray-400 uppercase">Bar</label>
<select id="comercio" class="w-full border border-gray-200 rounded-xl p-3.5 mb-5 bg-white outline-none focus:border-black"></select>

<label class="text-[12px] font-bold tracking-widest text-gray-400 uppercase">Turno</label>
<select id="turno" class="w-full border border-gray-200 rounded-xl p-3.5 mb-5 bg-white outline-none focus:border-black">
<option value="comida">Comida — caduca 16:00</option>
<option value="cena">Cena — caduca 23:30</option>
</select>

<label class="text-[12px] font-bold tracking-widest text-gray-400 uppercase">Menú de hoy</label>
<textarea id="texto" rows="4" class="w-full border border-gray-200 rounded-xl p-3.5 mb-6 outline-none focus:border-black" placeholder="Ej: Paella + bebida 10€"></textarea>

<button onclick="publicar()" class="w-full bg-black text-white rounded-xl py-4 font-bold text-[15px] active:scale-[0.98] transition">Publicar</button>
<p id="msg" class="text-center text-sm mt-4 font-medium text-green-600"></p>
</div>

<script>
// CONFIG AUTOMÁTICA - funciona en menuplus.es si está en Firebase Hosting
// Si estás en GitHub Pages, usará el projectId (los comercios aparecerán)
const firebaseConfig = {
  apiKey: "AIzaSyD3o6GqY4k5r7a8b9c0d1e2f3g4h5i6j7k8",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};
// Si la config automática de hosting existe, la usa. Si no, usa la de arriba.
try { firebase.app(); } catch(e){ firebase.initializeApp(firebaseConfig); }
const db = firebase.firestore();

async function cargar(){
  try{
    const snap = await db.collection("comercios").get();
    const sel = document.getElementById("comercio");
    sel.innerHTML = "";
    if(snap.empty){ sel.innerHTML = '<option>No hay comercios - créalos en admin.html</option>'; return; }
    snap.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=d.data().nombre||d.id; sel.appendChild(o); });
  }catch(err){ console.error(err); alert("Error cargando bares: "+err.message+"\nSi ves esto, copia tu firebaseConfig real de Firebase Console"); }
}
cargar();

function getExpireAt(turno){
  const ahora = new Date();
  const d = new Date();
  if(turno==="comida") d.setHours(16,0,0,0); else d.setHours(23,30,0,0);
  if(d <= ahora) d.setDate(d.getDate()+1);
  return firebase.firestore.Timestamp.fromDate(d);
}

async function publicar(){
  const comercioId = document.getElementById("comercio").value;
  const texto = document.getElementById("texto").value.trim();
  const turno = document.getElementById("turno").value;
  if(!texto) return alert("Escribe el menú");
  if(!comercioId) return alert("No hay comercio seleccionado");
  await db.collection("anuncios").add({
    comercioId, texto, turno,
    creado: firebase.firestore.FieldValue.serverTimestamp(),
    expireAt: getExpireAt(turno)
  });
  document.getElementById("msg").textContent = "✅ Publicado. Se borrará solo a las "+(turno==="comida"?"16:00":"23:30");
  document.getElementById("texto").value="";
}
</script>
</body>
</html>
