<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus - Panel Bar</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
    body { font-family: Arial; background: #002F6C; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: white; color: #333; padding: 20px; border-radius: 10px; }
    h1 { color: #002F6C; text-align: center; }
    input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #FFC107; color: #002F6C; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    label { font-weight: bold; font-size: 14px; }
    .aviso { background: #ffdddd; color: #d8000c; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; }
    .cerrado { background:#002F6C; height:100vh; display:flex; justify-content:center; align-items:center; color:white; text-align:center; padding:20px }
</style>
</head>
<body>
<div id="app"></div>

<script>
// CLAVE NUEVA - ACTUALIZADA 3/8/2026
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ahora = new Date();
const hora = ahora.getHours();
const minutos = ahora.getMinutes();
const horaActual = hora + minutos/60;
let turnoActual = "";
let panelBloqueado = false;

// 1. COMPROBAR HORARIO ANTES DE TODO
if(horaActual < 8 || horaActual >= 23.5){
  panelBloqueado = true;
  document.getElementById('app').innerHTML = `
  <div class="cerrado">
    <div>
      <h1>🔒 Panel Cerrado</h1>
      <h2>Vuelve a partir de las 8:00</h2>
      <p>El horario para publicar es de 8:00 a 23:30</p>
    </div>
  </div>`;
  auth.signOut(); 
} 
else if(horaActual >= 8 && horaActual < 16){
    turnoActual = "comida";
} 
else if(horaActual >= 16 && horaActual < 23.5){
    turnoActual = "cena";
}

// 2. SOLO SI NO ESTA BLOQUEADO CARGAMOS EL PANEL
if(!panelBloqueado){
document.getElementById('app').innerHTML = `
<div class="container">
    <h1>Publicar Menú de Hoy</h1>
    <div id="login-box">
        <input type="email" id="email" placeholder="Email del bar">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="entrar()">Entrar / Registrarse</button>
    </div>
    <div id="panel-box" style="display:none">
        <p>Bienvenido: <b id="userEmail"></b></p>
        <div id="avisoTurno" class="aviso"></div>
        <label>Nombre del Bar</label>
        <input type="text" id="barNombre">
        <label>Teléfono WhatsApp para Pedidos</label>
        <input type="tel" id="barTelefono">
        <label>Turno Actual</label>
        <select id="turno" disabled></select>
        <label>Menú del día</label>
        <textarea id="menu" rows="6" placeholder="1º Plato... 2º Plato... Postre... Precio"></textarea>
        <button id="btnPublicar" onclick="publicar()">Publicar Oferta</button>
        <button style="background:#ccc;margin-top:10px" onclick="salir()">Cerrar Sesión</button>
    </div>
</div>`;

// BORRAR ANUNCIOS VIEJOS DEL TURNO ANTERIOR
db.collection("anuncios").get().then(snapshot => {
    snapshot.forEach(doc => {
        const data = doc.data();
        if(data.turno !== turnoActual){
            db.collection("anuncios").doc(doc.id).delete();
        }
    })
})

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('panel-box').style.display = 'block';
    document.getElementById('userEmail').innerText = user.email;
    document.getElementById('turno').innerHTML = `<option>${turnoActual}</option>`;
    document.getElementById('avisoTurno').innerText = `Publicando para el turno: ${turnoActual}`;
  }
})
}

// 3. FUNCIONES
function entrar(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email, password)
  .catch((error) => {
    if(error.code === 'auth/user-not-found'){
      auth.createUserWithEmailAndPassword(email, password);
    } else {
      alert(error.message);
    }
  });
}

function publicar(){
  const btn = document.getElementById('btnPublicar');
  btn.disabled = true;
  btn.innerText = "Publicando...";
  
  db.collection("anuncios").add({
    bar: document.getElementById('barNombre').value,
    telefono: document.getElementById('barTelefono').value,
    texto: document.getElementById('menu').value,
    turno: turnoActual,
    fecha: new Date().toLocaleString('es-ES')
  }).then(() => {
    alert("¡Oferta publicada con éxito!");
    document.getElementById('menu').value = "";
    btn.disabled = false;
    btn.innerText = "Publicar Oferta";
  }).catch((error) => {
    alert("Error: " + error.message);
    btn.disabled = false;
    btn.innerText = "Publicar Oferta";
  });
}

function salir(){
  auth.signOut();
  location.reload();
}
</script>
</body>
</html>
