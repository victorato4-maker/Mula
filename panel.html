<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Comercio - MenuPlus Mula</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;padding:20px;max-width:500px;margin:auto}input,textarea,select,button{width:100%;padding:12px;margin:8px 0}button{background:#111;color:#fff;border:0}</style>
</head>
<body>
<h2>Publicar menú</h2>
<select id="comercio"></select>
<select id="turno"><option value="comida">Comida (caducará 16:00)</option><option value="cena">Cena (caducará 23:30)</option></select>
<textarea id="texto" placeholder="Ej: Paella + bebida 10€"></textarea>
<button onclick="publicar()">Publicar</button>
<p id="msg"></p>
<script>
const firebaseConfig = { projectId: "menuplus-mula" }; // si tenías tu config completa, déjala
// Si tu config antigua era más larga, pégala aquí entera. Con projectId solo ya funciona si estás en el mismo dominio.
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function cargarComercios(){
  const snap = await db.collection("comercios").get();
  const sel = document.getElementById("comercio");
  snap.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=d.data().nombre||d.id; sel.appendChild(o); });
}
cargarComercios();

function getExpireAt(turno){
  const ahora = new Date();
  const d = new Date();
  if(turno==="comida"){ d.setHours(16,0,0,0); }
  else{ d.setHours(23,30,0,0); }
  if(d <= ahora){ d.setDate(d.getDate()+1); }
  return firebase.firestore.Timestamp.fromDate(d);
}

async function publicar(){
  const comercioId = document.getElementById("comercio").value;
  const texto = document.getElementById("texto").value;
  const turno = document.getElementById("turno").value;
  if(!texto) return alert("Escribe el menú");
  await db.collection("anuncios").add({
    comercioId, texto, turno,
    creado: firebase.firestore.FieldValue.serverTimestamp(),
    expireAt: getExpireAt(turno)
  });
  document.getElementById("msg").textContent = "✅ Publicado, se borrará solo a las "+(turno==="comida"?"16:00":"23:30");
  document.getElementById("texto").value="";
}
</script>
</body>
</html>
