<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuPlus - Panel</title>
<style>
body{font-family:Arial;background:#F8F9FA;margin:0;padding:20px;color:#002F6C}
.container{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h1{color:#002F6C;text-align:center}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border:2px solid #FFC300;border-radius:8px;font-size:16px;box-sizing:border-box}
button{background:#002F6C;color:#FFC300;border:none;font-weight:800;cursor:pointer;font-size:18px}
button:hover{opacity:.9} button:disabled{background:#ccc;color:#666;cursor:not-allowed}
.hidden{display:none}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1;background:#FFC300;color:#002F6C}
.tabs button.active{background:#002F6C;color:#FFC300}
.plato-input{display:flex;gap:8px;margin-bottom:6px}
.plato-input button{width:45px;padding:0;background:#c00;color:#fff}
#alerta{background:#c00;color:#fff;padding:15px;border-radius:8px;text-align:center;font-weight:800;margin-bottom:15px;font-size:16px}
#preview{margin-top:20px;text-align:center}
#preview canvas{width:100%!important;height:auto!important;border:4px solid #FFC300;border-radius:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
<h1>🍽️ Panel MenuPlus</h1>
<div id="alerta" class="hidden"></div>
<div id="auth">
  <input id="email" type="email" placeholder="Correo del bar">
  <input id="pass" type="password" placeholder="Contraseña">
  <div id="extraCampos" class="hidden">
    <input id="nombreBar" placeholder="Nombre del Bar">
    <input id="telefono" placeholder="Teléfono">
  </div>
  <button onclick="registrar()">Registrarse</button>
  <button onclick="login()">Entrar</button>
  <p id="authMsg" style="color:#c00"></p>
</div>
<div id="panel" class="hidden">
  <h2 id="bienvenida"></h2>
  <button onclick="logout()" style="background:#c00">Cerrar Sesión</button>
  <hr>
  <h3 id="turnoActual"></h3>
  <div class="tabs">
    <button id="btnOferta" class="active" onclick="setTipo('oferta')">Oferta Rápida</button>
    <button id="btnMenu" onclick="setTipo('menu')">Menú del Día</button>
  </div>
  <div id="formOferta">
    <textarea id="textoOferta" rows="3" placeholder="Ej: 2 Cañas + Tapa por 3€"></textarea>
  </div>
  <div id="formMenu" class="hidden">
    <input id="precio" type="number" step="0.01" placeholder="Precio € Ej: 12.50">
    <b>PRIMEROS</b><div id="listaPrimeros"></div><button onclick="addPlato('primeros')" style="background:#FFC300;color:#002F6C">+ Añadir Primero</button>
    <b>SEGUNDOS</b><div id="listaSegundos"></div><button onclick="addPlato('segundos')" style="background:#FFC300;color:#002F6C">+ Añadir Segundo</button>
  </div>
  <button onclick="publicar()">Generar Imagen y Publicar</button>
  <p id="msg"></p>
  <div id="preview"><p>Pulsa el botón para generar</p></div>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
let tipoActual='oferta'; let nombreBar=''; let turnoActual=''; let contadores={primeros:0,segundos:0};

function getHorario(){
  const ahora = new Date();
  const h = ahora.getHours() + ahora.getMinutes()/60;
  if(h >= 8 && h < 16.5) return {turno: "comida", puedePublicar: true}; // 8:00 a 16:30
  if(h >= 16.5 && h < 23.5) return {turno: "cena", puedePublicar: true}; // 16:30 a 23:30
  return {turno: "cerrado", puedePublicar: false}; // 23:31 a 7:59
}

async function borrarOfertasViejas(turnoNuevo){
  const snap = await db.collection("anuncios").where("turno", "!=", turnoNuevo).get();
  if(snap.empty) return;
  const batch = db.batch();
  snap.forEach(doc => batch.delete(doc.ref));
  await batch.commit();
  console.log("Borradas ofertas del turno anterior");
}

auth.onAuthStateChanged(async user=>{
  if(user){
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    const horario = getHorario();
    turnoActual = horario.turno;

    if(!horario.puedePublicar){
      document.getElementById('alerta').classList.remove('hidden');
      document.getElementById('alerta').innerText = "⛔ Fuera de horario. Comida: 8:00-16:30. Cena: 16:30-23:30";
      document.getElementById('panel').querySelectorAll('button, input, textarea').forEach(el=>el.disabled=true);
    } else {
      await borrarOfertasViejas(turnoActual);
      document.getElementById('turnoActual').innerText = "Publicando para: " + turnoActual.toUpperCase();
      addPlato('primeros'); addPlato('primeros'); addPlato('segundos'); addPlato('segundos');
    }

    db.collection('bares').doc(user.uid).get().then(doc=>{ if(doc.exists){ nombreBar=doc.data().nombre; document.getElementById('bienvenida').innerText='Hola '+nombreBar; }});
  }else{ document.getElementById('auth').classList.remove('hidden'); document.getElementById('panel').classList.add('hidden'); }
});

function registrar(){ const e=document.getElementById('email').value; const p=document.getElementById('pass').value; const n=document.getElementById('nombreBar').value; const t=document.getElementById('telefono').value; if(!n ||!t) return alert('Rellena nombre y teléfono'); auth.createUserWithEmailAndPassword(e,p).then(cred=>{ db.collection('bares').doc(cred.user.uid).set({nombre:n,telefono:t,email:e}); document.getElementById('authMsg').innerText='Registrado. Ya puedes entrar'; }).catch(err=>document.getElementById('authMsg').innerText=err.message); }
function login(){ auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pass').value).catch(err=>document.getElementById('authMsg').innerText=err.message); }
function logout(){auth.signOut()}
function setTipo(t){ tipoActual=t; document.getElementById('btnOferta').classList.toggle('active',t==='oferta'); document.getElementById('btnMenu').classList.toggle('active',t==='menu'); document.getElementById('formOferta').classList.toggle('hidden',t!=='oferta'); document.getElementById('formMenu').classList.toggle('hidden',t!=='menu'); }
function addPlato(tipo){ contadores[tipo]++; const div=document.createElement('div'); div.className='plato-input'; div.innerHTML=`<input id="${tipo}_${contadores[tipo]}" placeholder="Plato ${contadores[tipo]}"><button onclick="this.parentNode.remove()">X</button>`; document.getElementById('lista'+tipo.charAt(0).toUpperCase()+tipo.slice(1)+'s').appendChild(div); }

async function publicar(){
  if(!getHorario().puedePublicar) return alert("Fuera de horario");
  let datos={bar:nombreBar,tipo:tipoActual,turno:turnoActual,timestamp:firebase.firestore.FieldValue.serverTimestamp()};
  if(tipoActual==='oferta'){ datos.textoOferta=document.getElementById('textoOferta').value; datos.precio="Ver"; if(!datos.textoOferta)return alert('Escribe la oferta'); }
  else { datos.precio=document.getElementById('precio').value; if(!datos.precio)return alert('Pon precio'); }
  await db.collection("anuncios").add(datos);
  document.getElementById('msg').innerText='✅ Publicado para '+turnoActual+'! Recarga la web';
}
</script>
</body>
</html>
