<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Panel MenuPlus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>body{background:#0A2540}.btn-yellow{background:#FFC700;color:#0A2540}</style>
</head>
<body class="text-white">
<div id="login" class="max-w-md mx-auto mt-20 p-6 bg-white text-black rounded-lg">
<h1 class="text-2xl font-bold mb-4 text-center">MenuPlus - Panel Bar</h1>
<input id="email" type="email" placeholder="Email" class="w-full p-2 border mb-2 rounded">
<input id="pass" type="password" placeholder="Contraseña" class="w-full p-2 border mb-4 rounded">
<button onclick="login()" class="w-full btn-yellow font-bold py-2 rounded">Entrar / Registrarse</button>
<p id="error" class="text-red-600 mt-2 text-center"></p>
</div>

<div id="baneado" class="hidden max-w-md mx-auto mt-20 p-6 bg-red-600 text-white rounded-lg text-center">
<h1 class="text-2xl font-bold mb-4">❌ CUENTA SUSPENDIDA</h1>
<p>Tu bar ha sido suspendido por MenuPlus por incumplir normas.</p>
<p class="mt-2">Contacta: victorato4@hotmail.com</p>
</div>

<div id="panel" class="hidden max-w-2xl mx-auto mt-10 p-6">
<h1 class="text-3xl font-bold text-center">Hola <span id="barName"></span></h1>
<p id="status" class="mb-4"></p>
<div id="formulario" class="bg-white text-black p-6 rounded-lg">
<label class="font-bold">Escribe tu menú o oferta:</label>
<textarea id="textoMenu" rows="4" class="w-full p-2 border rounded mt-2"></textarea>
<button id="btnPublicar" onclick="publicar()" class="w-full btn-yellow font-bold py-3 rounded mt-4">PUBLICAR MENÚ</button>
<button id="btnBorrar" onclick="borrar()" class="w-full bg-red-600 text-white font-bold py-2 rounded mt-2">BORRAR MI ANUNCIO</button>
</div>
<div id="vistaPrevia" class="mt-6 hidden">
<h2 class="font-bold mb-2">Tu imagen para WhatsApp:</h2>
<div id="plantilla" class="bg-[#0A2540] p-6 rounded-lg border-4 border-[#FFC700]">
<img src="logo-menuplus.png" class="h-12 mx-auto mb-4">
<p id="textoEnImagen" class="text-white text-2xl text-center font-bold"></p>
<p class="text-[#FFC700] text-center mt-4">menuplus.es</p>
</div>
<button onclick="descargarImagen()" class="w-full btn-yellow font-bold py-2 rounded mt-2">DESCARGAR IMAGEN</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore(); let userId=null;

function getTurno(){const h=new Date().getHours()+new Date().getMinutes()/60; if(h>=8&&h<16)return"comida"; if(h>=16&&h<23.5)return"cena"; return"cerrado";}

function actualizarUI(){const t=getTurno(); const btn=document.getElementById('btnPublicar'); const form=document.getElementById('formulario'); const status=document.getElementById('status'); if(t==="cerrado"){form.style.display='none'; status.innerText="CERRADO: VUELVE A PARTIR DE LAS 8:00"; status.style.background="#FFC700"; status.style.color="#0A2540"; status.style.fontSize="28px"; status.style.fontWeight="bold"; status.style.padding="30px"; status.style.textAlign="center"; status.style.borderRadius="12px"; status.style.margin="40px auto"; status.style.maxWidth="600px"}else{form.style.display='block'; btn.innerText=`PUBLICAR MENÚ DE ${t.toUpperCase()}`; status.innerText=`Horario activo: ${t}`; status.style.background=""; status.style.color=""; status.style.fontSize=""; status.style.padding=""; status.style.margin=""}}

async function publicar(){const texto=document.getElementById('textoMenu').value; const t=getTurno(); if(!texto)return alert("Escribe algo"); if(t==="cerrado")return alert("Fuera de horario"); await db.collection("anuncios").doc(userId).delete(); await db.collection("anuncios").doc(userId).set({bar:auth.currentUser.email,texto:texto,turno:t,timestamp:new Date(),expira:t==="comida"?"16:00":"23:30",baneado:false}); document.getElementById('textoEnImagen').innerText=texto; document.getElementById('vistaPrevia').classList.remove('hidden'); alert("¡Publicado!")}

async function borrar(){await db.collection("anuncios").doc(userId).delete(); alert("Borrado")}

function descargarImagen(){html2canvas(document.getElementById('plantilla')).then(c=>{const a=document.createElement('a'); a.download='menu-menuplus.png'; a.href=c.toDataURL(); a.click()})}

async function login(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('pass').value;
  document.getElementById('error').innerText="";
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){
    try{
      await auth.createUserWithEmailAndPassword(email,pass);
      await db.collection("bares").doc(email).set({bar:email,baneado:false});
    }catch(e2){
      document.getElementById('error').innerText = e2.message;
    }
  }
}

auth.onAuthStateChanged(async user=>{
  if(user){
    userId=user.uid;
    const doc = await db.collection("bares").doc(user.email).get();
    if(doc.exists && doc.data().baneado === true){
      document.getElementById('login').classList.add('hidden');
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('baneado').classList.remove('hidden');
      auth.signOut();
    }else{
      if(!doc.exists) await db.collection("bares").doc(user.email).set({bar:user.email,baneado:false});
      document.getElementById('login').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('barName').innerText=user.email.split('@')[0];
      actualizarUI();
      setInterval(actualizarUI,60000)
    }
  }else{
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('panel').classList.add('hidden')
  }
})
</script></body></html>
