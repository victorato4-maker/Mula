<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head><body><h2>Admin - Crear comercio</h2><input id="nombre" placeholder="Nombre bar"><button onclick="crear()">Crear</button>
<script>
const firebaseConfig = { projectId: "menuplus-mula" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
async function crear(){ const n=document.getElementById("nombre").value; if(!n)return; await db.collection("comercios").add({nombre:n}); alert("Creado"); }
</script></body></html>
