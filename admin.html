<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Panel MenuPlus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>body{background:#0A2540}.btn-yellow{background:#FFC700;color:#0A2540}</style>
</head>
<body class="text-white">
<div id="login" class="max-w-md mx-auto mt-20 p-6 bg-white text-black rounded-lg">
<h1 class="text-2xl font-bold mb-4 text-center">MenuPlus - Panel Bar</h1>
<input id="email" type="email" placeholder="Email" class="w-full p-2 border mb-2 rounded">
<input id="pass" type="password" placeholder="Contraseña" class="w-full p-2 border mb-4 rounded">
<button onclick="login()" class="w-full btn-yellow font-bold py-2 rounded">Entrar / Registrarse</button>
</div>
<div id="panel" class="hidden max-w-2xl mx-auto mt-10 p-6">
<h1 class="text-3xl font-bold">Hola <span id="barName"></span></h1>
<p id="status" class="mb-4"></p>
<div id="formulario" class="bg-white text-black p-6 rounded-lg">
<label class="font-bold">Escribe tu menú o oferta:</label>
<textarea id="textoMenu" rows="4" class="w-full p-2 border rounded mt-2"></textarea>
<button id="btnPublicar" onclick="publicar()" class="w-full btn-yellow font-bold py-3 rounded mt-4">PUBLICAR MENÚ</button>
<button id="btnBorrar" onclick="borrar()" class="w-full bg-red-600 text-white font-bold py-2 rounded mt-2">BORRAR MI ANUNCIO</button>
</div>
<div id="vistaPrevia" class="mt-6 hidden">
<h2 class="font-bold mb-2">Tu imagen para WhatsApp:</h2>
<div id="plantilla" class="bg-[#0A2540] p-6 rounded-lg border-4 border-[#FFC700]">
<img src="logo-menuplus.png" class="h-12 mx-auto mb-4">
<p id="textoEnImagen" class="text-white text-2xl text-center font-bold"></p>
<p class="text-[#FFC700] text-center mt-4">menuplus.es</p>
</div>
<button onclick="descargarImagen()" class="w-full btn-yellow font-bold py-2 rounded mt-2">DESCARGAR IMAGEN</button>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJ1CtPxnua7mxrZTusCGgo1DocTAIpi0w",
  authDomain: "menuplus-mula.firebaseapp.com",
  projectId: "menuplus-mula",
  storageBucket: "menuplus-mula.firebasestorage.app",
  messagingSenderId: "90841339782",
  appId: "1:90841339782:web:267a5bfb0c8338882a7e07"
};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore(); let userId=null;
function getTurno(){const h=new Date().getHours()+new Date().getMinutes()/60; if(h>=8&&h<16)return"comida"; if(h>=16&&h<23.5)return"cena"; return"cerrado";}
function actualizarUI(){const t=getTurno(); const btn=document.getElementById('btnPublicar'); const btnBorrar=document.getElementById('btnBorrar'); const form=document.getElementById('formulario'); const status=document.getElementById('status'); if(t==="cerrado"){form.style.display='none'; status.innerText="cerrado: vuelve a partir de las ocho"; status.style.background="#FFD700"; status.style.color="#003366"; status.style.fontSize="22px"; status.style.fontWeight="bold"; status.style.padding="20px"; status.style.textAlign="center"; status.style.borderRadius="8px"}else{form.style.display='block'; btn.innerText=`PUBLICAR MENÚ DE ${t.toUpperCase()}`; status.innerText=`Horario activo: ${t}`; status.style.background=""; status.style.color=""; status.style.fontSize=""; status.style.padding=""}}
async function publicar(){const texto=document.getElementById('textoMenu').value; const t=getTurno(); if(!texto)return alert("Escribe algo"); if(t==="cerrado")return alert("Fuera de horario"); await db.collection("anuncios").doc(userId).delete(); await db.collection("anuncios").doc(userId).set({bar:auth.currentUser.email,texto:texto,turno:t,timestamp:new Date(),expira:t==="comida"?"16:00":"23:30"}); document.getElementById('textoEnImagen').innerText=texto; document.getElementById('vistaPrevia').classList.remove('hidden'); alert("¡Publicado!")}
async function borrar(){await db.collection("anuncios").doc(userId).delete(); alert("Borrado")}
function descargarImagen(){html2canvas(document.getElementById('plantilla')).then(c=>{const a=document.createElement('a'); a.download='menu-menuplus.png'; a.href=c.toDataURL(); a.click()})}
function login(){auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pass').value).catch(()=>{auth.createUserWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pass').value)})}
auth.onAuthStateChanged(user=>{if(user){userId=user.uid; document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); document.getElementById('barName').innerText=user.email.split('@')[0]; actualizarUI(); setInterval(actualizarUI,60000)}else{document.getElementById('login').classList.remove('hidden'); document.getElementById('panel').classList.add('hidden')}})
</script></body></html>
